[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-guard"
version = "0.1.0"
description = "A PostgreSQL database migration risk checker"
requires-python = ">=3.11"
dependencies = [
    "pglast",
    "typer",
]

[project.optional-dependencies]
dev = ["import-linter", "pytest"]

[project.scripts]
migration-guard = "migration_guard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "migration_guard"

[[tool.importlinter.contracts]]
name = "Only the pglast adapter may import pglast"
type = "forbidden"
source_modules = [
    "migration_guard.rules",
    "migration_guard.cli",
    "migration_guard.ports",
]
forbidden_modules = ["pglast"]
